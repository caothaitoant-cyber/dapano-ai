body{font-family:'Montserrat',sans-serif;color:var(--text);line-height:1.7;font-size:11pt;background:#6B5E85;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;padding:18mm 18mm 14mm;page-break-after:always;position:relative;background:#fff;overflow:hidden;margin:0 auto}
.page:last-child{page-break-after:auto}
@media screen{.page{box-shadow:0 14px 40px rgba(0,0,0,.3);margin:12px auto}body{padding:12px 0}}
.logo-white{background-image:var(--logo-white-url);background-size:contain;background-repeat:no-repeat;background-position:left center}
.icon-purple{background-image:var(--icon-purple-url);background-size:contain;background-repeat:no-repeat}
.icon-white{background-image:var(--icon-white-url);background-size:contain;background-repeat:no-repeat}
.footer{position:absolute;bottom:7mm;left:18mm;right:18mm;display:flex;justify-content:space-between;align-items:center;font-size:8pt;color:var(--text-mute);border-top:1px solid var(--divider);padding-top:6px}
.footer .brand-mini{display:flex;align-items:center;gap:6px}
.footer .brand-mini .ic{width:12px;height:12px}
.footer .brand-text{font-weight:700;color:var(--indigo);letter-spacing:1.5px;font-size:7.5pt}
.footer .page-info{font-weight:600;color:var(--text-soft);letter-spacing:1px;font-size:7.5pt}
.cover{background:linear-gradient(135deg,#21135F 0%,#322168 50%,#5E067C 100%);color:#fff;padding:0;display:flex;flex-direction:column;justify-content:space-between}
.cover::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0,rgba(255,255,255,.04) 1px,transparent 1px,transparent 8px),repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0,rgba(255,255,255,.03) 1px,transparent 1px,transparent 14px);pointer-events:none}
.cover::after{content:"";position:absolute;bottom:-100px;right:-100px;width:500px;height:500px;background:radial-gradient(circle,rgba(212,168,86,.18) 0%,transparent 70%);border-radius:50%}
.cover-top{padding:20mm 22mm 0;position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start}
.cover-logo-block .lg{width:160px;height:36px;margin-bottom:6px}
.cover-tag-en{font-size:9pt;color:rgba(255,255,255,.7);letter-spacing:4px;text-transform:uppercase;font-weight:500}
.cover-edition{text-align:right;color:rgba(255,255,255,.6);font-size:9pt;letter-spacing:3px;line-height:1.6;font-weight:500}
.cover-mid{padding:0 22mm;position:relative;z-index:2;flex-grow:1;display:flex;flex-direction:column;justify-content:center}
.cover-badge{display:inline-block;border:1px solid rgba(212,168,86,.5);background:rgba(212,168,86,.1);color:var(--gold-light);padding:7px 18px;font-size:9pt;letter-spacing:4px;font-weight:700;margin-bottom:24px;text-transform:uppercase;align-self:flex-start;border-radius:50px}
.cover-eyebrow{font-size:11pt;color:var(--gold-light);letter-spacing:6px;text-transform:uppercase;font-weight:600;margin-bottom:18px}
.cover-title{font-family:'Playfair Display',serif;font-size:36pt;font-weight:900;line-height:1.05;margin-bottom:18px;color:#fff;letter-spacing:-1px}
.cover-title .accent{background:linear-gradient(90deg,var(--gold) 0%,#E8C175 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:block;font-style:italic}

<script>
(function(){
  var D = JSON.parse(document.getElementById('ho-so').textContent);
  var d = D.de_xuat, t = D.tra_loi;

  // ── Công thức trùng khớp Máy Tính Dòng Tiền 10 Năm ──
  function tinh(dc){
    dc = dc || {};
    var thue = d.thue_thang * (1 + (dc.thue||0));
    var trong = Math.max(0, d.thang_trong + (dc.trong||0));
    var g = Math.max(0, d.tang_thue + (dc.tang||0));
    var tong_von = d.gia_mua + d.chi_phi_mua + d.cai_tao;
    var vay = Math.max(0, tong_von - d.von_tu_co);
    var goc = d.ky_han > 0 ? vay / d.ky_han : 0;
    var nam = [], luy = 0;
    for (var n = 1; n <= 10; n++){
      var dt = Math.round(thue * Math.max(0, 12 - trong) * Math.pow(1 + g, n - 1));
      var cp = Math.round(d.cp_thang * 12 * Math.pow(1 + d.tang_cp, n - 1));
      var th = Math.round(dt * d.thue_pct);
      var noi = dt - cp - th;
      var du = Math.max(0, vay - goc * (n - 1));
      var tg = Math.min(goc, du);
      var ls = (n === 1 ? d.lai_nam_1 : d.lai_cac_nam_sau) + (dc.lai||0);
      var lai = Math.round((du + (du - tg)) / 2 * ls);
